const TAU = Math.PI * 2;
const clamp = (x, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, x));
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); }
function hash3(a, b, c) {
  let h = (Math.imul(a, 73856093) ^ Math.imul(b, 19349663) ^ Math.imul(c, 83492791)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return (h ^ (h >>> 16)) >>> 0;
}

const view = document.getElementById("view"), ctx = view.getContext("2d");

const FONT = `${FONT_SIZE}px Consolas, Menlo, "DejaVu Sans Mono", "Courier New", monospace`;
const probe = document.createElement("canvas").getContext("2d");
probe.font = FONT;
const CW = Math.ceil(probe.measureText("M").width), CH = FONT_SIZE;
const COUNT = BUCKETS.map(b => b.length), START = [];
BUCKETS.reduce((sum, bucket, i) => { START[i] = sum; return sum + bucket.length; }, 0);
const MASKS = [...BUCKETS.join("")].map(ch => {
  const tile = document.createElement("canvas"); tile.width = CW; tile.height = CH;
  const g = tile.getContext("2d");
  g.font = FONT; g.textBaseline = "middle"; g.fillStyle = "#fff";
  g.fillText(ch, 0, CH / 2);
  const pixels = g.getImageData(0, 0, CW, CH).data, mask = new Uint8Array(CW * CH);
  for (let k = 0; k < mask.length; k++) mask[k] = pixels[k * 4 + 3];
  return mask;
});

const ascii = document.createElement("canvas"), actx = ascii.getContext("2d");
const glowA = document.createElement("canvas"), glowB = document.createElement("canvas");
const glowCtxA = glowA.getContext("2d"), glowCtxB = glowB.getContext("2d");
let source, sourceWidth, sourceHeight, sourceTone, sourceColor, sourceAlpha;
let cols, rows, frame, px32, stepX, stepY, artWidth, artHeight;
let paused = false, ready = false, elapsed = 0, lastTime = null, lastDraw = -Infinity, raf = 0;

function prepareReference(image) {
  sourceWidth = image.naturalWidth; sourceHeight = image.naturalHeight;
  const sample = document.createElement("canvas");
  sample.width = sourceWidth; sample.height = sourceHeight;
  const g = sample.getContext("2d", { willReadFrequently: true });
  g.drawImage(image, 0, 0);
  source = g.getImageData(0, 0, sourceWidth, sourceHeight).data;
  const size = sourceWidth * sourceHeight;
  const gray = new Float32Array(size), figure = new Uint8Array(size);
  sourceTone = new Float32Array(size); sourceColor = new Float32Array(size * 3); sourceAlpha = new Float32Array(size);

  // Siluet longgar: warna langit dibuang setelahnya, termasuk celah antarrambut.
  g.clearRect(0, 0, sourceWidth, sourceHeight);
  g.fillStyle = "#fff";
  const silhouette = new Path2D("M 270 60 C 289 27 337 30 370 42 C 405 55 412 84 402 117 L 397 145 380 166 388 174 416 167 433 183 444 244 Q 466 274 462 302 L 434 366 432 390 438 428 434 453 445 502 449 573 478 640 62 640 Q 15 615 9 526 Q 0 478 27 456 L 64 437 105 443 109 372 Q 106 329 131 312 L 180 286 240 261 270 223 290 208 Q 243 228 200 211 Q 130 202 117 139 L 112 109 131 67 153 115 160 71 180 40 Q 171 96 216 113 Q 257 129 274 98 Z");
  g.fill(silhouette);
  const mask = g.getImageData(0, 0, sourceWidth, sourceHeight).data;
  for (let i = 0; i < size; i++) {
    const j = i * 4, r = source[j], green = source[j + 1], b = source[j + 2];
    gray[i] = (0.2126 * r + 0.7152 * green + 0.0722 * b) / 255;
    const sky = gray[i] > 0.64 && b >= r - 2 && green > r + 1;
    figure[i] = !sky && mask[j + 3] > 80 ? 1 : 0;
    sourceAlpha[i] = sky ? 0 : figure[i] ? 1 : 0.17;
  }
  for (let y = 0; y < sourceHeight; y++) for (let x = 0; x < sourceWidth; x++) {
    const i = y * sourceWidth + x, j = i * 4, k = i * 3;
    const r = source[j], green = source[j + 1], b = source[j + 2], l = gray[i];
    const left = gray[y * sourceWidth + Math.max(0, x - 1)];
    const right = gray[y * sourceWidth + Math.min(sourceWidth - 1, x + 1)];
    const top = gray[Math.max(0, y - 1) * sourceWidth + x];
    const bottom = gray[Math.min(sourceHeight - 1, y + 1) * sourceWidth + x];
    const edge = clamp(Math.hypot(right - left, bottom - top) * 1.8);
    const red = r > green * 1.35 && r > b * 1.25 && r > 65;
    const blue = b > 55 && b - r > 15 && b - green > 8;
    const eye = Math.hypot((x - 320) / 10, (y - 91) / 5) < 1 && r > 140 && green > 100;
    sourceTone[i] = sourceAlpha[i] === 0 ? 0 : figure[i]
      ? clamp(0.095 + 0.73 * Math.pow(l, 0.77) + edge * 0.24 + (red ? 0.16 : 0), 0, 0.95)
      : clamp(l * 0.32 + edge * 0.12, 0, 0.23);
    let rr, gg, bb;
    if (eye) { rr = 255; gg = 196; bb = 80; sourceTone[i] = 0.95; }
    else if (red) { rr = clamp(r * 1.38 + 32, 125, 238); gg = 42; bb = 53; }
    else if (blue) { rr = 100 + r * 0.15; gg = 125 + green * 0.15; bb = 181 + b * 0.15; }
    else if (figure[i]) {
      const brightness = 146 + l * 101;
      rr = brightness; gg = brightness + 2; bb = brightness + (l < 0.3 ? 10 : -5);
    } else { rr = 84; gg = 100; bb = 100; }
    sourceColor[k] = rr; sourceColor[k + 1] = gg; sourceColor[k + 2] = bb;
  }
}

function resize() {
  if (!ready) return;
  // Proporsi sel diperhitungkan: wajah tidak melebar pada layar portrait.
  const visibleHeight = Math.min(innerHeight * 0.96, innerWidth / (sourceWidth / sourceHeight) * 0.94);
  rows = clamp(Math.round(visibleHeight / 6.2), 90, 165);
  cols = Math.round(rows * CH / CW * sourceWidth / sourceHeight);
  ascii.width = cols * CW; ascii.height = rows * CH;
  frame = actx.createImageData(ascii.width, ascii.height); px32 = new Uint32Array(frame.data.buffer);
  stepX = sourceWidth / cols; stepY = sourceHeight / rows;
  const dpr = Math.min(devicePixelRatio || 1, 2);
  view.width = Math.max(1, Math.round(innerWidth * dpr)); view.height = Math.max(1, Math.round(innerHeight * dpr));
  const fit = Math.min(view.width * 0.96 / ascii.width, view.height * 0.97 / ascii.height);
  artWidth = ascii.width * fit; artHeight = ascii.height * fit;
  glowA.width = Math.ceil(ascii.width / 2); glowA.height = Math.ceil(ascii.height / 2);
  glowB.width = Math.ceil(ascii.width / 4); glowB.height = Math.ceil(ascii.height / 4);
  render(elapsed);
}

function render(t) {
  px32.fill(0);
  const phase = TAU * t / LOOP, breath = BREATH * (0.5 - 0.5 * Math.cos(phase));
  for (let row = 0; row < rows; row++) for (let col = 0; col < cols; col++) {
    const x = (col + 0.5) * stepX, y = (row + 0.5) * stepY;
    const upper = 1 - smoothstep(200, 630, y);
    const hair = (1 - smoothstep(200, 295, x)) * smoothstep(40, 90, y) * (1 - smoothstep(205, 235, y));
    const cloth = (1 - smoothstep(180, 282, x)) * smoothstep(270, 420, y);
    const dx = hair * WAVE * (Math.sin(phase - x / 75) + 0.25 * Math.sin(2 * phase - x / 40))
      + cloth * CLOAK * (Math.sin(phase - y / 95) + 0.2 * Math.sin(2 * phase - y / 45));
    const dy = breath * upper + hair * WAVE * 0.36 * Math.sin(phase - x / 105)
      + cloth * CLOAK * 0.2 * Math.sin(phase - y / 80);
    const sx = x - dx, sy = y + dy;
    if (sx < 0 || sx >= sourceWidth - 1 || sy < 0 || sy >= sourceHeight - 1) continue;
    const ix = Math.floor(sx), iy = Math.floor(sy), fx = sx - ix, fy = sy - iy;
    const i = iy * sourceWidth + ix, below = i + sourceWidth;
    const a = (1 - fx) * (1 - fy), b = fx * (1 - fy), c = (1 - fx) * fy, d = fx * fy;
    const alpha = sourceAlpha[i] * a + sourceAlpha[i + 1] * b + sourceAlpha[below] * c + sourceAlpha[below + 1] * d;
    if (alpha < 0.05) continue;
    const l = sourceTone[i] * a + sourceTone[i + 1] * b + sourceTone[below] * c + sourceTone[below + 1] * d;
    let level = 0;
    while (level < LEVELS.length && l >= LEVELS[level]) level++;
    if (level === 0) continue;
    const mask = MASKS[START[level] + hash3(row, col, 1) % COUNT[level]];
    const k = i * 3, kb = below * 3;
    const light = alpha * (0.68 + 0.32 * l) * (1 + cloth * 0.06 * Math.sin(phase - y / 65));
    const rr = clamp((sourceColor[k] * a + sourceColor[k + 3] * b + sourceColor[kb] * c + sourceColor[kb + 3] * d) * light, 0, 255) | 0;
    const gg = clamp((sourceColor[k + 1] * a + sourceColor[k + 4] * b + sourceColor[kb + 1] * c + sourceColor[kb + 4] * d) * light, 0, 255) | 0;
    const bb = clamp((sourceColor[k + 2] * a + sourceColor[k + 5] * b + sourceColor[kb + 2] * c + sourceColor[kb + 5] * d) * light, 0, 255) | 0;
    const color = (bb << 16) | (gg << 8) | rr;
    let offset = row * CH * ascii.width + col * CW, mi = 0;
    for (let yy = 0; yy < CH; yy++, offset += ascii.width) for (let xx = 0; xx < CW; xx++, mi++) {
      if (mask[mi]) px32[offset + xx] = (mask[mi] << 24) | color;
    }
  }
  actx.putImageData(frame, 0, 0);
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  ctx.fillStyle = `rgb(${BG.join(",")})`; ctx.fillRect(0, 0, view.width, view.height);
  const left = (view.width - artWidth) / 2, top = (view.height - artHeight) / 2;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(ascii, left, top, artWidth, artHeight);
  if (GLOW > 0) {
    glowCtxA.clearRect(0, 0, glowA.width, glowA.height); glowCtxA.drawImage(ascii, 0, 0, glowA.width, glowA.height);
    glowCtxB.clearRect(0, 0, glowB.width, glowB.height); glowCtxB.drawImage(glowA, 0, 0, glowB.width, glowB.height);
    ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = GLOW;
    ctx.drawImage(glowB, left, top, artWidth, artHeight);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
  }
}

function tick(now) {
  raf = 0;
  if (document.hidden || paused || reducedMotion.matches || !ready) { lastTime = null; return; }
  if (lastTime !== null) elapsed += Math.min(now - lastTime, 100) / 1000;
  lastTime = now;
  if (now - lastDraw >= 1000 / FPS - 1) { lastDraw = now; render(elapsed); }
  raf = requestAnimationFrame(tick);
}
function resume() {
  if (!raf && ready && !paused && !document.hidden && !reducedMotion.matches) {
    lastTime = null; lastDraw = -Infinity; raf = requestAnimationFrame(tick);
  }
}
addEventListener("resize", resize);
document.addEventListener("visibilitychange", resume);
reducedMotion.addEventListener("change", resume);
addEventListener("keydown", event => {
  if (event.ctrlKey || event.altKey || event.metaKey || event.repeat) return;
  if (event.code === "Space") {
    event.preventDefault(); paused = !paused; resume();
  } else if (event.key.toLowerCase() === "s" && ready) {
    const link = document.createElement("a"); link.download = "yoru-ascii.png";
    link.href = view.toDataURL("image/png"); link.click();
  }
});

const image = new Image();
image.onload = () => {
  try { prepareReference(image); ready = true; status.hidden = true; resize(); resume(); }
  catch (error) { status.textContent = "Gagal menyusun gambar ASCII."; console.error(error); }
};
image.onerror = () => { status.textContent = "Gambar referensi gagal dimuat."; };
image.src = REFERENCE;
</script>
</body>
